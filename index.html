<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>網代焼ができるまで パズル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF9EE; --ink:#3A2A1A; --sub:#7A6450; --card:#FFFFFF; --line:#E3D3BC;
  --soy:#8B4A1C; --soy-d:#5E2F0F; --rice:#F4E6C8; --ok:#2E9E5B; --ng:#E0452B; --sel:#FFB300;
  --d1:#DCEFFF; --d2:#E4F6DC; --d3:#FFF0C9; --d4:#FFE0D6;
  --d1b:#4A90D9; --d2b:#4FA34A; --d3b:#D9A400; --d4b:#E0703F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"UD デジタル 教科書体 NP-B","UD Digi Kyokasho NP-B","Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;cursor:pointer;border:none}
.hidden{display:none!important}

/* ---------- スタート画面 ---------- */
#start{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;gap:18px;text-align:center}
.logo{width:150px;height:auto}
#start h1{font-size:clamp(28px,5vw,48px);margin:0;color:var(--soy-d);line-height:1.3}
#start h1 small{display:block;font-size:.5em;color:var(--sub)}
.panel{background:#fff;border:3px solid var(--line);border-radius:24px;padding:18px 22px;width:min(720px,100%)}
.panel h2{margin:0 0 10px;font-size:22px}
.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.opt{background:var(--rice);border:3px solid transparent;border-radius:16px;padding:10px 16px;font-size:20px;color:var(--ink);min-width:88px}
.opt.on{border-color:var(--soy);background:#FFE7C2}
.opt .desc{display:block;font-size:14px;color:var(--sub);margin-top:2px}
.big{background:var(--soy);color:#fff;font-size:28px;padding:16px 48px;border-radius:999px;box-shadow:0 6px 0 var(--soy-d)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--soy-d)}
.rules{font-size:18px;line-height:1.8;text-align:left;margin:0;padding-left:1.2em}

/* ---------- ゲーム画面 ---------- */
#game{padding:10px 14px 24px;max-width:1280px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
header .title{font-size:clamp(20px,2.6vw,28px);color:var(--soy-d);margin-right:auto;display:flex;align-items:center;gap:8px}
header .title img{width:44px}
.chip{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:17px}
.tbtn{background:#fff;border:3px solid var(--soy);color:var(--soy-d);border-radius:999px;padding:8px 18px;font-size:19px}
.tbtn.primary{background:var(--soy);color:#fff;box-shadow:0 4px 0 var(--soy-d)}
.tbtn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--soy-d)}

#turn{display:flex;align-items:center;gap:12px;background:#fff;border:3px dashed var(--sel);border-radius:18px;padding:5px 12px;margin-bottom:8px;font-size:clamp(17px,2vw,22px)}
#turn .who{background:var(--sel);color:#3A2A00;border-radius:12px;padding:4px 12px;white-space:nowrap}
#turn .say{color:var(--sub)}

/* 台紙 */
#board{background:#fff;border:3px solid var(--line);border-radius:22px;padding:8px 10px;margin-bottom:4px}
.row{display:grid;gap:8px;margin-bottom:8px}
.row:last-child{margin-bottom:0}
.slot{position:relative;border:3px dashed #CDB79A;border-radius:14px;min-height:var(--ch);display:flex;align-items:stretch;justify-content:center;background:#FFFDF8}
.slot .num{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:34px;color:#D8C6AC}
.slot>.card{border:none;box-shadow:none;border-radius:11px}
.slot.target{border-color:var(--sel);border-style:solid;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px #FFB30066}}
.slot.ok{border:4px solid var(--ok)}
.slot.ng{border:4px solid var(--ng);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mark{position:absolute;right:-8px;top:-10px;width:34px;height:34px;border-radius:50%;color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;z-index:3;box-shadow:0 2px 4px #0003}
.mark.ok{background:var(--ok)} .mark.ng{background:var(--ng)}
.dayhead{display:grid;gap:8px;margin-bottom:4px}
.dayhead div{border-radius:10px;text-align:center;font-size:18px;padding:3px 0;color:#fff}
.dz1{background:var(--d1)} .dz2{background:var(--d2)} .dz3{background:var(--d3)} .dz4{background:var(--d4)}
.dl1{background:var(--d1b)} .dl2{background:var(--d2b)} .dl3{background:var(--d3b)} .dl4{background:var(--d4b)}

/* カード */
#tray{display:flex;overflow-x:auto;gap:10px;scroll-snap-type:x proximity;background:var(--rice);border-radius:22px;padding:10px;min-height:calc(var(--ch) + 24px)}
#tray .card{flex:0 0 var(--cw);scroll-snap-align:start}
#tray .empty{flex:1;align-self:center;text-align:center;font-size:22px;color:var(--sub)}
.card{position:relative;background:var(--card);border:3px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;width:100%;min-height:var(--ch);box-shadow:0 3px 0 #0001;touch-action:none;transition:transform .12s}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;pointer-events:none}
.card .txt{flex:1;display:flex;align-items:center;justify-content:center;padding:3px 4px 5px;font-size:clamp(13px,1.4vw,17px);line-height:1.28;word-break:keep-all;overflow-wrap:anywhere;text-align:center}
.card.sel{border-color:var(--sel);transform:translateY(-6px) scale(1.03);box-shadow:0 8px 14px #0003;z-index:2}
.card.ghost{position:fixed;pointer-events:none;z-index:50;opacity:.92;transform:rotate(-3deg) scale(1.05);box-shadow:0 12px 24px #0004}
.card.dragging{opacity:.3}
.zoom{position:absolute;right:4px;top:4px;width:32px;height:32px;border-radius:50%;background:#fffd;font-size:17px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px #0003}
.noimg .card img,.noimg .zoom{display:none}
.noimg .card .txt{font-size:clamp(16px,1.8vw,22px)}
.tag{position:absolute;left:4px;top:4px;background:#fffe;border-radius:10px;padding:2px 8px;font-size:15px;box-shadow:0 1px 3px #0003}

/* 下のボタン列 */
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0 4px}
.actions .tbtn{font-size:22px;padding:10px 26px}
#msg{text-align:center;font-size:clamp(17px,2vw,24px);min-height:1.5em;margin:4px 0 6px}

/* モーダル */
.modal{position:fixed;inset:0;background:#3A2A1A99;display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.mbox{background:#fff;border-radius:26px;padding:22px 26px;max-width:760px;width:100%;max-height:92vh;overflow:auto;text-align:center}
.mbox h2{margin:4px 0 10px;font-size:clamp(24px,3.4vw,36px);color:var(--soy-d)}
.mbox p{font-size:21px;line-height:1.7;margin:8px 0}
.mbox img.photo{width:100%;border-radius:14px}
.hintcard{background:#FFF6DA;border:3px solid var(--sel);border-radius:18px;padding:14px;font-size:24px;margin:10px 0}

/* クリア後：人の手・きかい */
#mission{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.mcard{border:3px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;padding:0;text-align:center}
.mcard img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.mcard .t{font-size:15px;padding:4px 4px 0;min-height:2.8em;display:flex;align-items:center;justify-content:center;line-height:1.3}
.mcard .st{font-size:17px;padding:4px 0 6px;color:var(--sub)}
.mcard.hito{border-color:#E0703F;background:#FFF0EA} .mcard.hito .st{color:#C2501F}
.mcard.kikai{border-color:#4A90D9;background:#EEF6FF} .mcard.kikai .st{color:#2F6FB4}
.mcard.both{border-color:#8A5BC8;background:#F5EEFF} .mcard.both .st{color:#6A3BA8}
.tally{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-size:20px}
.tally span{border-radius:12px;padding:4px 12px;background:#F4EFE7}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:200}

@media (max-width:820px){
  #mission{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:560px){
  #mission{grid-template-columns:repeat(2,1fr)}
  .slot .num{font-size:22px}
}
</style>
</head>

const DAYS = [{d:1,n:2},{d:2,n:5},{d:3,n:1},{d:4,n:4}];
const HINTS = [
  "いちばん さいしょは「米を あらう」だよ。",
  "いちばん さいごは「ふくろに つめて、はこに つめる」だよ。",
  "こなに しないと、まぜる ことは できないね。",
  "しょうゆだれを つけるのは、やいた あとだよ。",
  "「かわかす」は ぜんぶで 3回 あるよ。やく 前に 2回、やいた あとに 1回。",
];
const LEVELS = [
  {k:"easy",   name:"かんたん",   desc:"日にちの わく・しゃしん つき"},
  {k:"normal", name:"ふつう",     desc:"しゃしん つき"},
  {k:"hard",   name:"チャレンジ", desc:"ことばだけ"},
];

/* ---------- 状態 ---------- */
let S = {han:1, nin:4, lv:"easy", slots:Array(12).fill(null), tray:[], turn:0, checks:0, hint:0, hito:{}, done:false};
let selected = null; // {from:'tray'|'slot', id, idx}
const $ = s => document.querySelector(s);
const byId = id => CARDS.find(c=>c.id===id);

function save(){ try{ localStorage.setItem("ajiro-puzzle", JSON.stringify(S)); }catch(e){} }
function load(){ try{ const v = JSON.parse(localStorage.getItem("ajiro-puzzle")); if(v && v.slots) return v; }catch(e){} return null; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* ---------- スタート画面 ---------- */
function opts(el, items, cur, onPick){
  el.innerHTML = "";
  items.forEach(it=>{
    const b = document.createElement("button");
    b.className = "opt" + (it.v===cur ? " on" : "");
    b.innerHTML = it.label + (it.desc ? `<span class="desc">${it.desc}</span>` : "");
    b.onclick = ()=>{ onPick(it.v); [...el.children].forEach(x=>x.classList.remove("on")); b.classList.add("on"); };
    el.appendChild(b);
  });
}
opts($("#optHan"), [1,2,3,4,5,6,7,8].map(n=>({v:n,label:n+"はん"})), S.han, v=>S.han=v);
opts($("#optNin"), [2,3,4,5,6].map(n=>({v:n,label:n+"人"})), S.nin, v=>S.nin=v);
opts($("#optLv"), LEVELS.map(l=>({v:l.k,label:l.name,desc:l.desc})), S.lv, v=>S.lv=v);

$("#go").onclick = ()=>{
  S.slots = Array(12).fill(null); S.tray = shuffle(CARDS.map(c=>c.id));
  S.turn = 0; S.checks = 0; S.hint = 0; S.hito = {}; S.done = false;
  startGame();
};
function startGame(){
  $("#start").classList.add("hidden"); $("#game").classList.remove("hidden");
  $("#hanChip").textContent = S.han + "はん";
  $("#lvChip").textContent = "レベル：" + LEVELS.find(l=>l.k===S.lv).name;
  document.body.classList.toggle("noimg", S.lv==="hard");
  render(); save();
}
// つづきから
const prev = load();
if(prev && prev.tray && prev.tray.length < 12 && !prev.done){
  const b = document.createElement("button");
  b.className="tbtn"; b.textContent="つづきから はじめる"; b.style.fontSize="20px";
  b.onclick=()=>{ S = prev; startGame(); };
  $("#go").after(b);
}

/* ---------- 描画 ---------- */
function cardEl(id){
  const c = byId(id);
  const el = document.createElement("div");
  el.className = "card"; el.dataset.id = id;
  el.innerHTML = `<img src="${c.img}" alt=""><div class="txt">${c.t}</div><button class="zoom" aria-label="大きく見る">🔍</button>`;
  el.querySelector(".zoom").addEventListener("pointerdown", e=>e.stopPropagation());
  el.querySelector(".zoom").onclick = e=>{ e.stopPropagation(); showPhoto(c); };
  return el;
}
function slotEl(i){
  const s = document.createElement("div");
  s.className = "slot"; s.dataset.slot = i;
  if(S.slots[i]==null){ s.innerHTML = `<span class="num">${i+1}</span>`; }
  else { const c = cardEl(S.slots[i]); s.appendChild(c); bindCard(c,"slot",i); }
  s.addEventListener("click", ()=>tapSlot(i));
  return s;
}
function render(){
  const board = $("#board"); board.innerHTML = "";
  const cw = getComputedStyle(document.documentElement);
  if(S.lv==="easy"){
    // 1日目＋2日目 ／ 3日目＋4日目
    [[DAYS[0],DAYS[1]],[DAYS[2],DAYS[3]]].forEach(pair=>{
      const total = pair[0].n + pair[1].n;
      const cols = `repeat(${Math.max(total,7)},1fr)`;
      const head = document.createElement("div"); head.className="dayhead"; head.style.gridTemplateColumns = cols;
      const row = document.createElement("div"); row.className="row"; row.style.gridTemplateColumns = cols;
      let start = pair[0].d===1 ? 0 : 7;
      pair.forEach(D=>{
        const h = document.createElement("div"); h.className = "dl"+D.d; h.textContent = D.d+"日目"; h.style.gridColumn = `span ${D.n}`; head.appendChild(h);
        for(let k=0;k<D.n;k++){ const s = slotEl(start+k); s.classList.add("dz"+D.d); row.appendChild(s); }
        start += D.n;
      });
      board.appendChild(head); board.appendChild(row);
    });
  } else {
    for(let r=0;r<2;r++){
      const row = document.createElement("div"); row.className="row"; row.style.gridTemplateColumns="repeat(6,1fr)";
      for(let k=0;k<6;k++) row.appendChild(slotEl(r*6+k));
      board.appendChild(row);
    }
  }
  const tray = $("#tray"); tray.innerHTML = "";
  if(S.tray.length===0){ tray.innerHTML = `<div class="empty">ぜんぶ おけたね！「こたえあわせ」を おそう</div>`; }
  S.tray.forEach(id=>{ const c = cardEl(id); tray.appendChild(c); bindCard(c,"tray",null); });
  $("#who").textContent = `つぎは ${S.turn % S.nin + 1}ばんの 人`;
  highlight();
  sizeCards();
}
function sizeCards(){
  const w = document.querySelector("#board .row").getBoundingClientRect().width;
  const cols = S.lv==="easy" ? 7 : 6;
  const cardW = (w - 8*(cols-1)) / cols;
  const h = S.lv==="hard" ? Math.max(90, cardW*0.62) : cardW*0.5625 + 62;
  document.documentElement.style.setProperty("--ch", Math.round(h)+"px");
  document.documentElement.style.setProperty("--cw", Math.round(cardW)+"px");
}
window.addEventListener("resize", ()=>{ if(!$("#game").classList.contains("hidden")) sizeCards(); });

function highlight(){
  document.querySelectorAll(".card.sel").forEach(e=>e.classList.remove("sel"));
  document.querySelectorAll(".slot.target").forEach(e=>e.classList.remove("target"));
  if(!selected) return;
  const el = selected.from==="tray" ? $(`#tray .card[data-id="${selected.id}"]`) : $(`.slot[data-slot="${selected.idx}"] .card`);
  if(el) el.classList.add("sel");
  document.querySelectorAll(".slot").forEach(s=>{ if(S.slots[+s.dataset.slot]==null) s.classList.add("target"); });
}

/* ---------- 操作：タップ ---------- */
function tapCard(from, id, idx){
  if(selected && selected.id===id){ // もう一度タッチ → 台紙のカードはトレーへもどす
    if(from==="slot"){ S.slots[idx]=null; S.tray.push(id); }
    selected=null; clearMarks(); render(); save(); return;
  }
  if(selected && from==="slot"){ placeTo(idx); return; } // 入れかえ
  selected = {from, id, idx}; highlight();
  setMsg(from==="tray" ? "おきたい わくを タッチしよう" : "べつの わくを タッチすると うごくよ。もう一ど タッチで もどす");
}
function tapSlot(i){
  if(!selected){ return; }
  placeTo(i);
}
function placeTo(i){
  const sel = selected; selected = null;
  const there = S.slots[i];
  if(sel.from==="tray"){
    S.tray = S.tray.filter(x=>x!==sel.id);
    if(there!=null) S.tray.push(there);
    S.slots[i] = sel.id;
    S.turn++;
  } else {
    if(sel.idx===i){ render(); return; }
    S.slots[sel.idx] = there; S.slots[i] = sel.id;
  }
  clearMarks(); setMsg("いいね！ つぎの 人に こうたい しよう"); render(); save();
}
function clearMarks(){ document.querySelectorAll(".mark").forEach(m=>m.remove()); }
function setMsg(t){ $("#msg").textContent = t; }

/* ---------- 操作：ドラッグ ---------- */
function bindCard(el, from, idx){
  let sx, sy, ghost=null, moved=false;
  el.addEventListener("pointerdown", e=>{
    if(e.button>0) return;
    sx=e.clientX; sy=e.clientY; moved=false; el.setPointerCapture(e.pointerId);
  });
  el.addEventListener("pointermove", e=>{
    if(sx==null) return;
    if(!moved && Math.hypot(e.clientX-sx, e.clientY-sy) > 10){
      moved = true;
      const r = el.getBoundingClientRect();
      ghost = el.cloneNode(true); ghost.classList.add("ghost"); ghost.style.width = r.width+"px";
      document.body.appendChild(ghost); el.classList.add("dragging");
      selected = {from, id:+el.dataset.id, idx}; highlight();
    }
    if(moved){ ghost.style.left = (e.clientX - ghost.offsetWidth/2)+"px"; ghost.style.top = (e.clientY - 40)+"px"; }
  });
  const end = e=>{
    if(sx==null) return; sx=null;
    if(!moved){ // タップあつかい
      e.stopPropagation(); tapCard(from, +el.dataset.id, idx); return;
    }
    ghost.remove(); el.classList.remove("dragging");
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const slot = under && under.closest(".slot");
    if(slot){ placeTo(+slot.dataset.slot); }
    else if(under && under.closest("#tray") && from==="slot"){ S.slots[idx]=null; S.tray.push(+el.dataset.id); selected=null; clearMarks(); render(); save(); }
    else { selected=null; highlight(); }
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", e=>{ sx=null; if(ghost){ghost.remove(); el.classList.remove("dragging");} selected=null; highlight(); });
  el.addEventListener("click", e=>e.stopPropagation());
}

/* ---------- こたえあわせ ---------- */
$("#checkBtn").onclick = ()=>{
  selected = null; highlight(); clearMarks();
  if(S.tray.length>0){ setMsg(`まだ ${S.tray.length}まい のこって いるよ。ぜんぶ おいてから こたえあわせ しよう`); return; }
  S.checks++;
  let ok = 0;
  S.slots.forEach((id,i)=>{
    const s = $(`.slot[data-slot="${i}"]`);
    const good = id===i+1;
    if(good) ok++;
    s.classList.remove("ok","ng"); void s.offsetWidth; s.classList.add(good?"ok":"ng");
    const m = document.createElement("div"); m.className = "mark " + (good?"ok":"ng"); m.textContent = good?"○":"✕";
    s.appendChild(m);
  });
  save();
  if(ok===12){ S.done=true; save(); confetti(); setTimeout(showClear, 900); }
  else setMsg(`12まい中 ${ok}まい せいかい！ ✕の カードを はんで そうだんして 入れかえよう（${S.checks}回目）`);
};

/* ---------- ヒント ---------- */
$("#hintBtn").onclick = ()=>{
  const n = Math.min(S.hint, HINTS.length-1);
  const list = HINTS.slice(0, n+1).map((h,i)=>`<div class="hintcard" style="${i<n?'opacity:.55;font-size:19px':''}">ヒント${i+1}：${h}</div>`).join("");
  openModal(`<h2>💡 ヒント</h2>${list}
    <p style="font-size:17px;color:var(--sub)">見学で 見た ことや、メモを 思い出そう</p>
    <div class="actions">${S.hint < HINTS.length-1 ? '<button class="tbtn" id="moreHint">つぎの ヒント</button>' : ''}<button class="tbtn primary" id="closeM">とじる</button></div>`);
  if($("#moreHint")) $("#moreHint").onclick = ()=>{ S.hint++; save(); $("#hintBtn").click(); };
  $("#closeM").onclick = closeModal;
};

$("#resetBtn").onclick = ()=>{
  openModal(`<h2>さいしょから やりなおす？</h2><p>おいた カードが ぜんぶ もどります。</p>
    <div class="actions"><button class="tbtn" id="noR">やめる</button><button class="tbtn primary" id="yesR">やりなおす</button></div>`);
  $("#noR").onclick = closeModal;
  $("#yesR").onclick = ()=>{ closeModal(); try{localStorage.removeItem("ajiro-puzzle");}catch(e){} location.reload(); };
};

/* ---------- 写真を大きく ---------- */
function showPhoto(c){
  openModal(`<img class="photo" src="${c.img}" alt=""><p style="font-size:26px">${c.t}</p><button class="tbtn primary" id="closeM">とじる</button>`);
  $("#closeM").onclick = closeModal;
}
function openModal(html){ $("#mbox").innerHTML = html; $("#modal").classList.remove("hidden"); }
function closeModal(){ $("#modal").classList.add("hidden"); }
$("#modal").addEventListener("click", e=>{ if(e.target.id==="modal") closeModal(); });

/* ---------- クリア ---------- */
function showClear(){
  openModal(`<h2>🎉 かんせい！</h2>
    <p>網代焼は <b style="font-size:1.5em;color:var(--ng)">4日</b> かけて できあがる。<br>（こたえあわせ ${S.checks}回で クリア）</p>
    <div class="hintcard">はんで 話そう：<br>「かわかす」は 何回 あったかな？ どうして だろう？</div>
    <div class="actions"><button class="tbtn primary" id="toMission">つぎの ミッションへ ▶</button></div>`);
  $("#toMission").onclick = showMission;
}
const ST = [{k:null,l:"？"},{k:"hito",l:"🙋 人の 手"},{k:"kikai",l:"⚙ きかい"},{k:"both",l:"🙋⚙ りょうほう"}];
function showMission(){
  const cards = CARDS.map(c=>{
    const k = S.hito[c.id] || null; const st = ST.find(x=>x.k===k);
    return `<button class="mcard ${k||''}" data-id="${c.id}"><img src="${c.img}" alt=""><div class="t">${c.t}</div><div class="st">${st.l}</div></button>`;
  }).join("");
  const cnt = k => Object.values(S.hito).filter(v=>v===k).length;
  openModal(`<h2>ミッション２：人の 手？ きかい？</h2>
    <p style="font-size:18px">見学を 思い出して、カードを タッチして 分けよう。<br>タッチするたびに「人の 手 → きかい → りょうほう」と かわるよ。</p>
    <div id="mission">${cards}</div>
    <div class="tally"><span>🙋 人の 手 ${cnt("hito")}</span><span>⚙ きかい ${cnt("kikai")}</span><span>🙋⚙ りょうほう ${cnt("both")}</span></div>
    <div class="hintcard" style="font-size:20px">きかいが 多い？ 人の 手が 多い？<br>2時間目の よそうと くらべて みよう。</div>
    <div class="actions"><button class="tbtn primary" id="closeM">とじる</button></div>`);
  document.querySelectorAll(".mcard").forEach(b=>b.onclick = ()=>{
    const id = +b.dataset.id; const i = ST.findIndex(x=>x.k===(S.hito[id]||null));
    S.hito[id] = ST[(i+1)%ST.length].k; save();
    const sc = $("#mbox").scrollTop; showMission(); $("#mbox").scrollTop = sc;
  });
  $("#closeM").onclick = ()=>{ closeModal(); setMsg("🎉 クリア！ ほかの はんにも 「どうして その じゅんばん？」を 話して みよう"); addMissionBtn(); };
}
function addMissionBtn(){
  if($("#again")) return;
  const b = document.createElement("button"); b.className="tbtn"; b.id="again"; b.textContent="ミッション２を ひらく";
  b.onclick = showMission; $(".actions").appendChild(b);
}

/* ---------- 紙ふぶき ---------- */
function confetti(){
  const cv = $("#fx"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const colors = ["#E0452B","#FFB300","#2E9E5B","#4A90D9","#8B4A1C","#E0703F"];
  const P = Array.from({length:160},()=>({x:Math.random()*cv.width, y:-20-Math.random()*cv.height*.5, vx:(Math.random()-.5)*3, vy:2+Math.random()*4, r:Math.random()*6.28, vr:(Math.random()-.5)*.3, c:colors[Math.floor(Math.random()*colors.length)], s:6+Math.random()*8}));
  let t=0;
  (function f(){
    ctx.clearRect(0,0,cv.width,cv.height);
    P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); ctx.restore(); });
    if(++t<220) requestAnimationFrame(f); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}
</script>
